10. Big Change / Layout Refactor
Till here everything was fine. Then I decided to add a 
"Terms and conditions apply" text, but I wanted it to look
separate from the main hero content on a white section.

So I created a `.hero` section.
The hero section is used for the first impression of the website
and contains the most important elements:
- Logo
- Heading
- Button

After moving these elements into the hero section,
the layout changed because a div only takes the height
of its content by default.

To fix this, I moved the background-image related properties
from the `body` to the `.hero` class and used:

`min-height: 100vh;`
This ensures the hero section always covers the full
viewport height, regardless of screen size.
I also added `margin: 0` to the body to remove the default
8px browser margin, allowing the hero section to touch
the edges of the browser completely.
